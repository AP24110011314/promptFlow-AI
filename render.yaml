services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: promptflow-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: promptflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "8000"

  # 2. React Frontend Static Site
  - type: static
    name: promptflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: promptflow-backend
          property: url
      - key: VITE_API_URL
        fromService:
          type: web
          name: promptflow-backend
          property: url
          append: /api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: promptflow-db
    databaseName: promptflow_database
    user: promptflow_user
    plan: free
    region: singapore
