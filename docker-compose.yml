services:
  db:
    image: postgres:15-alpine
    container_name: crd_db
    restart: always
    environment:
      - POSTGRES_USER=crd_user
      - POSTGRES_PASSWORD=crd_password
      - POSTGRES_DB=crd_database
    ports:
      - "5432:5432"
    volumes:
      - ./backend/storage/postgres_data:/var/lib/postgresql/data
    networks:
      - crd_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crd_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL
      - SECRET_KEY=crd_super_secret_jwt_key_2026_advanced_research_digest
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - EMAIL_INTEGRATION_ENABLED
      - EMAIL_IMAP_SERVER
      - EMAIL_IMAP_PORT
      - EMAIL_USERNAME
      - EMAIL_PASSWORD
      - EMAIL_POLL_INTERVAL
      - EMAIL_SMTP_SERVER
      - EMAIL_SMTP_PORT
      - USE_CELERY
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - crd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crd_frontend
    restart: always
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - crd_network

  redis:
    image: redis:alpine
    container_name: crd_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - crd_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crd_celery_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      - DATABASE_URL
      - SECRET_KEY=crd_super_secret_jwt_key_2026_advanced_research_digest
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - EMAIL_INTEGRATION_ENABLED
      - EMAIL_IMAP_SERVER
      - EMAIL_IMAP_PORT
      - EMAIL_USERNAME
      - EMAIL_PASSWORD
      - EMAIL_POLL_INTERVAL
      - EMAIL_SMTP_SERVER
      - EMAIL_SMTP_PORT
      - USE_CELERY
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
      - db
      - backend
    networks:
      - crd_network

networks:
  crd_network:
    driver: bridge
