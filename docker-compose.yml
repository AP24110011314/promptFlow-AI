services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crd_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./storage/crd_database.db
      - SECRET_KEY=crd_super_secret_jwt_key_2026_advanced_research_digest
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
    volumes:
      - ./backend/storage:/app/storage
    networks:
      - crd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crd_frontend
    restart: always
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - crd_network

networks:
  crd_network:
    driver: bridge
